<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d22">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Football Fortunes · Serie A</title>
<style>
:root {
  --bg: #f2f4f1; --surface: #ffffff; --surface2: #f6f8f5; --ink: #142017; --muted: #66746a; --line: #e2e8e1;
  --brand: #0f3d22; --brand2: #1d6b3c; --accent: #f2c230; --me: #fff4cc; --me-line: #e9b81a;
  --good: #1f8a4c; --bad: #c9362b; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0b110d; --surface: #151d17; --surface2: #1b251d; --ink: #eaf1ea; --muted: #93a396; --line: #26322a;
    --me: #3a3214; --me-line: #b8901a; --shadow: none; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
header { background: linear-gradient(135deg, var(--brand), var(--brand2)); color: #fff; padding: calc(12px + env(safe-area-inset-top)) 16px 14px; position: sticky; top: 0; z-index: 5; }
.hrow { display: flex; align-items: center; gap: 10px; }
header .crest-svg { filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
.crest { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.15); display: grid; place-items: center; font-weight: 800; font-size: 14px; flex: none; }
.club { flex: 1; min-width: 0; }
.club b { display: block; font-size: 18px; line-height: 1.15; }
.club small { opacity: .8; font-size: 13px; }
.pills { display: flex; gap: 6px; margin-top: 10px; }
.pill { background: rgba(255,255,255,.14); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.pill.gold { background: var(--accent); color: #2a2000; }
main { padding: 14px 14px 8px; max-width: 560px; margin: 0 auto; }
.card { background: var(--surface); border-radius: 18px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.card.hero { border: 2px solid var(--brand2); }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
h3 { font-size: 19px; margin: 0 0 6px; line-height: 1.25; }
.muted { color: var(--muted); font-size: 14px; }
.cardtext { font-size: 18px; line-height: 1.45; margin: 6px 0 4px; }
button { font: inherit; font-weight: 600; border: 0; border-radius: 14px; padding: 13px 16px; background: var(--brand2); color: #fff; cursor: pointer; min-height: 48px; }
button.alt { background: var(--surface2); color: var(--ink); border: 1px solid var(--line); }
button.small { min-height: 38px; padding: 8px 12px; font-size: 14px; border-radius: 11px; }
button:disabled { opacity: .35; }
button:active:not(:disabled) { transform: scale(.98); }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.stack { display: grid; gap: 8px; margin-top: 12px; }
.big { width: 100%; font-size: 18px; min-height: 56px; margin-top: 12px; }
nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
nav button { flex: 1; background: none; color: var(--muted); border-radius: 0; padding: 8px 2px 10px; font-size: 11px; min-height: 60px;
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 600; }
nav button span { font-size: 21px; line-height: 1; }
nav button.on { color: var(--brand2); }
nav button .badge { position: absolute; }
/* board */
.board { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; aspect-ratio: 1; background: var(--brand); border-radius: 18px; padding: 6px; }
.sq { border-radius: 6px; display: grid; place-items: center; position: relative; font-size: clamp(13px, 4vw, 20px); }
.sq.here { outline: 3px solid #fff; outline-offset: -1px; z-index: 1; }
.sq .dots { position: absolute; bottom: 1px; left: 0; right: 0; display: flex; justify-content: center; gap: 1px; }
.sq .dots { flex-wrap: wrap; align-content: flex-end; top: 1px; gap: 0; } .sq .dots .dot { width: 7px; height: 7px; border-width: 1px; }
.sq .dots .dot.tok { width: 13px; height: 13px; border-width: 2px; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #fff; display: inline-block; flex: none; }
.centre { grid-column: 2 / 10; grid-row: 2 / 10; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; gap: 4px; }
.die { width: 64px; height: 64px; border-radius: 16px; background: #fff; color: var(--brand); display: grid; place-items: center; font-size: 36px; font-weight: 800; }
.centre b { font-size: 18px; } .legend { font-size: 12px; opacity: .9; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; padding: 0 8px; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
/* players */
.player { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.player:last-child { border-bottom: 0; }
.pname { display: flex; align-items: center; gap: 8px; min-width: 0; }
.pname .n { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pos { flex: none; width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font-weight: 800; font-size: 12px; color: #fff; }
.pos.G { background: #d08a17; } .pos.D { background: #2a6fb6; } .pos.M { background: #23914b; } .pos.A { background: #c9362b; } .pos.U { background: #7650b3; }
.stars { color: var(--accent); font-size: 13px; letter-spacing: -1px; white-space: nowrap; }
.tag { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 6px; background: var(--surface2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.tag.red { color: var(--bad); }
/* pitch */
.pitch { background: repeating-linear-gradient(180deg, #2a8a46 0 36px, #279042 36px 72px); border-radius: 16px; padding: 12px 6px; margin-top: 12px; }
.line { display: flex; justify-content: center; gap: 6px; margin: 8px 0; }
.chip { background: rgba(0,0,0,.28); color: #fff; border-radius: 10px; padding: 6px 4px; text-align: center; width: 23%; max-width: 92px; }
.chip b { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .stars { font-size: 11px; }
.sums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; text-align: center; }
.sum { background: var(--surface2); border-radius: 12px; padding: 8px 4px; }
.sum b { display: block; font-size: 22px; } .sum small { color: var(--muted); font-size: 12px; }
/* club badges */
.crest-svg { flex: none; vertical-align: middle; filter: drop-shadow(0 1px 1px rgba(0,0,0,.2)); }
.clubname { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.clubname span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clubpick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.clubpick button { display: flex; align-items: center; gap: 8px; justify-content: flex-start; }
.clubpick button.on { background: var(--brand2); color: #fff; }
.clubbtn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; }
tr[data-team] { cursor: pointer; }
/* player cards */
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
@media (min-width: 520px) { .cards { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.pcard { --c: #c8102e; background: var(--c); border-radius: 12px; padding: 3px; color: #111; display: flex; flex-direction: column; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
.pcard.G { --c: #d0861a; } .pcard.D { --c: #2a6fb6; } .pcard.M { --c: #1f8a46; } .pcard.A { --c: #c8102e; } .pcard.U { --c: #7650b3; }
.pcard .ph { display: flex; justify-content: space-between; align-items: center; color: #fff; padding: 1px 4px 3px; }
.pcard .ph small { display: none !important; } .pcard.big .ph small { display: block !important; }
.pcard .ph small { font-weight: 800; font-size: 10px; letter-spacing: .06em; display: block; line-height: 1.1; }
.pcard .st { font-size: 11px; letter-spacing: 1px; line-height: 1.1; } .pcard .st span { opacity: .35; }
.pcard .num { width: 20px; height: 20px; font-size: 13px !important; border-radius: 50%; background: #fff; color: var(--c); display: grid; place-items: center; font-weight: 900; font-size: 16px; }
.pcard .art { background: color-mix(in srgb, var(--c) 14%, #fff); border-radius: 10px 10px 0 0; position: relative; padding: 4px 6px 0; }
.pcard .art .avatar { display: block; width: 100%; height: auto; max-height: 84px; }
.pcard .pclub { position: absolute; top: 5px; left: 6px; }
.pcard .first, .pcard .last, .pcard .role, .pcard .ctags, .pcard .cfoot { background: #fff; text-align: center; }
.pcard .first { font-size: 10px; color: #555; padding-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard .last { font-weight: 900; line-height: 1.1; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .01em; }
.pcard .role { color: var(--c); font-weight: 900; font-size: 9px; letter-spacing: .04em; padding: 3px 0 4px; }
.pcard .ctags { padding-bottom: 6px; display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
.pcard .ctags .tag { background: #f1f1f1; color: #555; border-color: #e3e3e3; }
.pcard .cfoot button { padding: 6px 2px; min-height: 34px; font-size: 12px; border-radius: 10px; }
.pcard .cfoot { padding: 0 3px 3px; border-radius: 0 0 10px 10px; }
.pcard .cfoot button { width: 100%; }
.pcard > :last-child { border-radius: 0 0 10px 10px; }
.pcard.big { max-width: 200px; margin: 0 auto; padding: 5px; } .pcard.big .art .avatar { max-height: 170px; } .pcard.big .role { font-size: 11px; } .pcard.big .first { font-size: 12px; }
.solo { margin: 10px 0; }
/* results */
.rhead { font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 6px; }
.rhead:first-child { margin-top: 0; }
.match { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 10px; border-radius: 14px; background: var(--surface2); margin-bottom: 6px; border: 1px solid transparent; }
.match.mine { background: var(--me); border-color: var(--me-line); }
.team { min-width: 0; } .team.away { text-align: right; }
.team .tn { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 6px; }
.team.away .tn { justify-content: flex-end; }
.team .tn span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team.me .tn { font-weight: 800; }
.da { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
.da i { font-style: normal; font-weight: 700; color: var(--ink); }
.score { font-size: 22px; font-weight: 800; min-width: 58px; text-align: center; font-variant-numeric: tabular-nums; }
.gate { grid-column: 1 / -1; font-size: 12px; color: var(--muted); text-align: center; margin-top: -2px; }
.win { color: var(--good); } .loss { color: var(--bad); }
.note { padding: 8px 0; font-weight: 600; }
/* table */
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
td, th { padding: 9px 4px; text-align: center; border-bottom: 1px solid var(--line); }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
td.t, th.t { text-align: left; }
tr.me td { background: var(--me); font-weight: 700; }
/* feed */
.feed div { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.feed div:last-child { border-bottom: 0; }
.feed div.me { font-weight: 600; }
.feed div.wk { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; border: 0; padding-top: 14px; }
.notice { background: var(--me); border: 1px solid var(--me-line); border-radius: 14px; padding: 10px 12px; margin-bottom: 14px; font-size: 15px; }
label { display: block; margin: 14px 0 6px; font-weight: 600; font-size: 14px; }
input, select { font: inherit; width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); color: var(--ink); min-height: 48px; }
.seg { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.seg button { flex: none; }
.auction .bid { font-size: 26px; font-weight: 800; margin-top: 10px; }

/* tactics */
.tactics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
.tactics button { padding: 8px 2px; min-height: 52px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tactics small { font-size: 10px; font-weight: 500; opacity: .85; white-space: nowrap; }
.tactics button.on { background: var(--brand2); color: #fff; }
/* dice and token */
.die.rolling { animation: tumble .14s linear infinite; }
.die.landed { animation: pop .35s ease-out; }
@keyframes tumble { 0% { transform: rotate(0) scale(.9); } 50% { transform: rotate(180deg) scale(1.08); } 100% { transform: rotate(360deg) scale(.9); } }
@keyframes pop { 0% { transform: scale(1.6); } 100% { transform: scale(1); } }
.dot.tok { width: 15px; height: 15px; box-shadow: 0 0 0 2px #111; animation: hop .23s ease-out; z-index: 2; }
@keyframes hop { 0% { transform: translateY(-9px) scale(1.3); } 100% { transform: none; } }
/* auction result */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.7); display: grid; place-items: center; padding: 16px; overflow: hidden; animation: fade .2s; }
.obox { width: min(320px, 100%); text-align: center; color: #fff; display: grid; gap: 12px; animation: rise .4s cubic-bezier(.2,1.4,.4,1); }
.ocard { position: relative; width: 190px; margin: 0 auto; }
.stamp { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) rotate(-14deg); font-size: 40px; font-weight: 900; letter-spacing: .04em;
  padding: 2px 14px; border: 5px solid currentColor; border-radius: 12px; background: rgba(255,255,255,.88); animation: stamp .45s .25s both cubic-bezier(.3,1.6,.5,1); }
.won .stamp { color: var(--good); } .lost .stamp { color: var(--bad); } .none .stamp { color: #555; font-size: 28px; }
.lost .ocard { animation: shake .5s .5s; } .lost .ocard .pcard, .none .ocard .pcard { filter: grayscale(.6); }
.otext { font-size: 15px; } .otext .dot { vertical-align: -1px; }
.overlay i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; animation: fall linear both; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
@keyframes stamp { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(-14deg) scale(3); } 100% { opacity: 1; transform: translate(-50%, -50%) rotate(-14deg) scale(1); } }
@keyframes shake { 0%, 100% { transform: none; } 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
@keyframes rise { from { transform: translateY(30px) scale(.9); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .overlay *, .die, .dot.tok { animation: none !important; } .overlay i { display: none; } }
/* sticky main action above the tabs */
.actbar { position: fixed; left: 0; right: 0; bottom: calc(61px + env(safe-area-inset-bottom)); z-index: 4; padding: 8px 16px;
  background: linear-gradient(transparent, var(--bg) 35%); }
.actbar:empty { display: none; }
.actbar .big { margin: 0; box-shadow: 0 4px 14px rgba(0,0,0,.25); max-width: 560px; display: block; margin: 0 auto; }
.actbar .big.alt { background: var(--surface); }
main:has(~ .actbar:not(:empty)) { padding-bottom: 170px; }
/* coaches strip (play tab, in the sticky header) */
.coaches { display: flex; gap: 6px; overflow-x: auto; margin: 10px -16px -4px; padding: 0 16px 2px; scrollbar-width: none; }
.coaches::-webkit-scrollbar { display: none; }
.coach { flex: none; display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.12); color: #fff; border-radius: 10px; padding: 4px 9px 4px 6px; min-height: 0; text-align: left; font-weight: 500; }
.coach.me { background: var(--accent); color: #2a2000; }
.coach span { display: flex; flex-direction: column; line-height: 1.15; } .coach b { font-size: 12px; white-space: nowrap; } .coach small { font-size: 10.5px; opacity: .85; white-space: nowrap; }
/* match preview */
.versus { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; margin: 8px 0 4px; }
.vside { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding: 10px 4px; border-radius: 14px; background: var(--surface2); border: 1px solid var(--line); }
.vside.me { background: var(--me); border-color: var(--me-line); }
.vside b { font-size: 16px; line-height: 1.15; } .vside small { font-size: 12px; color: var(--muted); }
.vside .da { font-size: 13px; }
.vs { font-weight: 900; color: var(--muted); font-size: 14px; }
.fx { display: grid; grid-template-columns: 28px 1fr 14px 1fr 28px; align-items: center; gap: 4px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.fx span { color: var(--muted); font-size: 12px; text-align: center; } .fx i { text-align: center; color: var(--muted); font-style: normal; }
.tn em { font-style: normal; color: var(--muted); font-size: 11px; font-weight: 600; }
/* auction owner + other coaches' news */
.owner { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin: 2px 0 4px; font-size: 15px; } .owner .muted { font-size: 13px; }
.toast span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toasts { position: fixed; left: 0; right: 0; bottom: calc(132px + env(safe-area-inset-bottom)); z-index: 15; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0 16px; pointer-events: none; }
.toast { pointer-events: auto; max-width: 528px; width: 100%; display: flex; align-items: center; gap: 8px; background: rgba(20,32,23,.9); color: #fff; font-size: 12px;
  padding: 6px 10px; border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.25); animation: tin .3s both, tout .5s both; }
@keyframes tin { from { opacity: 0; transform: translateY(12px); } }
@keyframes tout { to { opacity: 0; transform: translateY(-8px); } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
.rolehead { margin: 14px 0 -4px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; gap: 6px; }
.rolehead::before { content: ''; width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.rolehead.G { --c: #d0861a; } .rolehead.D { --c: #2a6fb6; } .rolehead.M { --c: #1f8a46; } .rolehead.A { --c: #c8102e; } .rolehead.U { --c: #7650b3; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>
