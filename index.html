<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f2e">
<title>Football Fortunes</title>
<style>
:root { --bg: #e9efe4; --card: #fff; --ink: #1b241c; --muted: #5d6b5f; --green: #1f5f2e; --pitch: #2f7d3e; --line: #d3ddd0; --gold: #c99a1c; --bad: #b3261e; --good: #1d7a3a; }
@media (prefers-color-scheme: dark) { :root { --bg: #111712; --card: #1b231c; --ink: #e8efe6; --muted: #9aa99b; --line: #2c382d; --green: #2d7a40; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, sans-serif; padding-bottom: 72px; }
header { background: var(--green); color: #fff; padding: 10px 16px calc(10px) ; position: sticky; top: 0; z-index: 5; }
header .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
header b { font-size: 17px; } header small { opacity: .85; }
main { padding: 12px 16px; max-width: 640px; margin: 0 auto; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.card h3 { margin: 0 0 6px; font-size: 16px; }
.muted { color: var(--muted); font-size: 13px; }
button { font: inherit; border: 0; border-radius: 10px; padding: 11px 14px; background: var(--green); color: #fff; cursor: pointer; }
button.alt { background: transparent; color: var(--ink); border: 1px solid var(--line); }
button:disabled { opacity: .4; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.btns button { flex: 1 1 auto; }
.big { width: 100%; padding: 16px; font-size: 18px; margin-top: 8px; }
nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
nav button { flex: 1; background: none; color: var(--muted); border-radius: 0; padding: 12px 2px; font-size: 13px; }
nav button.on { color: var(--green); font-weight: 700; box-shadow: inset 0 3px 0 var(--green); }
.board { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; aspect-ratio: 1; background: var(--pitch); border-radius: 10px; padding: 4px; margin-bottom: 12px; position: relative; }
.sq { border-radius: 3px; font-size: 7.5px; line-height: 1.05; color: #111; display: flex; flex-direction: column; justify-content: space-between; padding: 2px; overflow: hidden; text-align: center; }
.sq .dots { display: flex; justify-content: center; gap: 1px; flex-wrap: wrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #fff; display: inline-block; }
.centre { grid-column: 2 / 10; grid-row: 2 / 10; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; }
.centre .die { font-size: 44px; font-weight: 800; } .centre small { opacity: .9; }
.player { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.player:last-child { border-bottom: 0; }
.pos { display: inline-block; min-width: 22px; text-align: center; font-weight: 700; font-size: 12px; border-radius: 4px; padding: 1px 4px; color: #fff; }
.pos.G { background: #c97a12; } .pos.D { background: #2c6fb3; } .pos.M { background: #2f8f4a; } .pos.A { background: #b3261e; } .pos.U { background: #6b4fa0; }
.stars { color: var(--gold); letter-spacing: -1px; white-space: nowrap; }
.tag { font-size: 11px; border-radius: 4px; padding: 1px 5px; background: var(--line); margin-left: 4px; }
.pitch { background: var(--pitch); border-radius: 12px; padding: 10px 6px; color: #fff; }
.line { display: flex; justify-content: center; gap: 6px; margin: 6px 0; }
.chip { background: rgba(255,255,255,.14); border-radius: 8px; padding: 5px 6px; text-align: center; font-size: 11px; width: 74px; }
.chip b { display: block; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.out { opacity: .45; text-decoration: line-through; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td, th { padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--line); }
td:nth-child(2), th:nth-child(2) { text-align: left; }
tr.me td { font-weight: 700; background: color-mix(in srgb, var(--green) 14%, transparent); }
.feed div { padding: 4px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.feed div.me { font-weight: 600; }
.feed div.wk { color: var(--muted); font-size: 12px; border: 0; padding-top: 10px; }
.notice { background: #fff6d6; color: #5b4500; border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; font-size: 14px; }
.cardtext { font-size: 17px; margin: 6px 0 2px; }
label { display: block; margin: 10px 0 4px; font-weight: 600; }
input, select { font: inherit; width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.auction .who { font-size: 22px; font-weight: 800; }
.res div { padding: 3px 0; font-size: 14px; } .res div:first-child, .res .h { font-weight: 700; margin-top: 6px; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>
